# Referenced configs are resolved relative to this file.
name: toy_reranking
seed: 42

dataset: ../dataset/toy.yaml
model: ../model/item_cooccurrence.yaml

# Actions applied to the same users. `grid` expands into one action per value
# (labels like calibration@0.25); this doubles as strength tuning for the
# best-uniform baseline, which is chosen on the validation period.
interventions:
  # Beyond-accuracy re-rankers; grid values listed weakest first (frontier.py relies on it).
  - {name: popularity_penalty, label: popularity, params: {candidate_size: 50}, grid: {penalty_weight: [0.1, 0.25, 0.5, 1.0]}}
  - {name: mmr, label: mmr, params: {candidate_size: 50}, grid: {relevance_weight: [0.9, 0.8, 0.6, 0.4]}}
  - {name: calibration, label: calibration, params: {candidate_size: 50, list_size: 10}, grid: {calibration_weight: [0.1, 0.25, 0.5, 0.8]}}
  # Information-adding action: fuse with a second model (accuracy routing, route.py).
  - {name: fusion, label: fusion, params: {model: {name: item_cooccurrence}}, grid: {weight: [0.2, 0.4]}}

evaluation:
  metrics: [hr, ndcg]
  k_values: [10]
  beyond_accuracy:            # per-user list quality; higher is better
    metrics: [tail, ild, calibration]
    head_fraction: 0.2        # most popular 20% of items are the head; the rest is the long tail

# All states are stored per user; states with `grouping` also get per-group summaries.
states:
  - name: history_length
    grouping:
      method: quantile        # quantile: cut_points are quantile levels; fixed: raw values
      cut_points: [0.3333, 0.6667]
      labels: [short, medium, long]
  - name: prediction_entropy
  - name: top_score
  - name: score_margin
  - name: history_popularity
  - name: history_category_entropy
  # Top-K boundary: how contested ranks around K are (K = 10 here).
  - {name: rank_gap, label: gap_10_11, params: {upper_rank: 10, lower_rank: 11}}
  - {name: rank_gap, label: gap_10_20, params: {upper_rank: 10, lower_rank: 20}}
  - {name: rank_gap, label: gap_10_50, params: {upper_rank: 10, lower_rank: 50}}
  - {name: top_entropy, label: top50_entropy, params: {top_n: 50}}

analysis:
  neutral_threshold: 0.0      # |gain| <= threshold -> neutral
  bootstrap:
    n_resamples: 1000
    confidence: 0.95

# Router (scripts/route.py): trained on validation-period effects, evaluated on test.
routing:
  action_prefixes: [fusion]   # router chooses among these actions (+ no-op); omit for all
  metric: ndcg@10             # router labels (denser than HR: any rank change counts)
  tiebreak_metric: hr@10      # breaks ties between actions with equal label gain
  report_metric: hr@10        # policies are reported on this; binary -> Rescue/Damage
  features: [prediction_entropy, top_score, score_margin, history_length, history_popularity,
             history_category_entropy, gap_10_11, gap_10_20, gap_10_50, top50_entropy]
  action_features: ["changed@10", "promoted_rank@10"]   # one column per action
  classifiers: [logistic, gbdt]
  balance_classes: true       # up-weight the rare users some action helps (n_neg / n_pos)
  harm_weight: 5.0            # extra BCE weight on base-correct users no action helps
  thresholds: [0.05, 0.1, 0.2, 0.3, 0.5, 0.7, 0.9]
  n_folds: 3                  # out-of-fold predictions choose the gate threshold
  seeds: [0, 1]
  uncertainty_feature: prediction_entropy
  uncertainty_quantiles: [0.5, 0.7, 0.9]

# Harm-aware routing of beyond-accuracy re-rankers (scripts/frontier.py).
frontier:
  families:                   # action label prefix -> the objective that re-ranker targets
    - {prefix: popularity, objective: tail@10}
    - {prefix: mmr, objective: ild@10}
    - {prefix: calibration, objective: calibration@10}
  label_metric: ndcg@10       # damage label: gain < 0
  report_metric: hr@10        # reported accuracy; Rescue/Damage@10
  features: [prediction_entropy, top_score, score_margin, history_length, history_popularity,
             history_category_entropy, gap_10_11, gap_10_20, gap_10_50, top50_entropy]
  action_features: ["changed@10", "promoted_rank@10"]
  classifiers: [logistic, gbdt]
  harm_weights: [1.0, 5.0]    # 1.0 = ablation without harm weighting
  seeds: [0, 1]
  n_thresholds: 101           # tau candidates = quantiles of validation P(damage)
  uncertainty_feature: prediction_entropy
  uncertainty_quantiles: [0.0, 0.2, 0.4, 0.6, 0.8, 0.9]

output_dir: outputs           # relative to the working directory
