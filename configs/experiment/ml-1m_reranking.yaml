# Requires: python scripts/prepare_data.py --config configs/dataset/ml-1m.yaml
# Referenced configs are resolved relative to this file.
name: ml-1m_reranking
seed: 42

dataset: ../dataset/ml-1m.yaml
model: ../model/item_cooccurrence.yaml

# Actions applied to the same users; each needs a unique `label` (defaults to `name`).
interventions:
  - {name: popularity_penalty, label: popularity, params: {penalty_weight: 0.25, candidate_size: 50}}
  - {name: mmr, label: mmr, params: {relevance_weight: 0.8, candidate_size: 50}}
  - {name: calibration, label: calibration, params: {calibration_weight: 0.5, candidate_size: 50, list_size: 20}}

evaluation:
  metrics: [hr, ndcg]
  k_values: [10, 20]

# All states are stored per user; states with `grouping` also get per-group summaries.
states:
  - name: history_length
    grouping:
      method: quantile        # quantile: cut_points are quantile levels; fixed: raw values
      cut_points: [0.3333, 0.6667]
      labels: [short, medium, long]
  - name: prediction_entropy
  - name: top_score
  - name: score_margin

analysis:
  neutral_threshold: 0.0      # |gain| <= threshold -> neutral
  bootstrap:
    n_resamples: 1000
    confidence: 0.95

output_dir: outputs           # relative to the working directory
